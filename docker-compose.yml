services:
  cleanpro:
    image: ghcr.io/michelle202420/cleanpro:latest

    container_name: cleanpro-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/cleanpro.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set in .env}

    volumes:
      - cleanpro_data:/app/data

volumes:
  cleanpro_data: